[project]
name = "smartbubble"
version = "0.1.0"
description = "SMS integration demo for Solution Engineers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
